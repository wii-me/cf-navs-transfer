name: Translate README

on:
  push:
    branches:
      - develop
    paths:
      - README.md
      - .github/workflows/translate-readme.yml
      - scripts/translate_readme_index.py
  workflow_dispatch:
    inputs:
      language:
        description: Target language
        type: choice
        options:
          - en
        default: en
        required: true
      preview:
        description: Preview only (translate first section, no pull request)
        type: boolean
        default: true

concurrency:
  group: translate-readme-${{ inputs.language || 'en' }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      LANGUAGE: ${{ inputs.language || 'en' }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Preview README translation (first section)
        id: preview
        if: ${{ inputs.preview }}
        shell: bash
        run: |
          python scripts/translate_readme_index.py --lang "$LANGUAGE" --preview \
            | tee "$RUNNER_TEMP/readme-preview.txt"
          {
            echo '# README translation preview'
            echo
            printf 'Source: `README.md` -> `translations/%s/README.md` (first section only)\n\n' "$LANGUAGE"
            echo '```markdown'
            cat "$RUNNER_TEMP/readme-preview.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Translate README via Index-Translate
        id: translate
        if: ${{ !inputs.preview }}
        shell: bash
        # Bilibili's free Index-Translate API (OpenAI-compatible, no key needed).
        # The script sends the hidden chat_template_kwargs.enable_thinking=false
        # parameter; without it the model emits chain-of-thought first.
        run: |
          python scripts/translate_readme_index.py --lang "$LANGUAGE"
          {
            echo '# README translation'
            echo
            printf 'Source: `README.md` -> `translations/%s/README.md`\n\n' "$LANGUAGE"
            echo 'Provider: Bilibili Index-Translate (free public API).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create translation pull request
        id: pr
        if: ${{ !inputs.preview && steps.translate.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: index-translate/readme-${{ inputs.language || 'en' }}
          base: develop
          title: "docs: translate README to ${{ inputs.language || 'en' }}"
          commit-message: "docs: translate README to ${{ inputs.language || 'en' }}"
          body: |
            Translated `README.md` -> `translations/${{ inputs.language || 'en' }}/README.md`
            using Bilibili's free Index-Translate API.

            Only source blocks whose text changed are translated again; unchanged
            blocks reuse the existing translation. The `.index-translate-state.json`
            sidecar records the source block hashes used for that alignment and must
            be merged together with the translation.

            Review translation wording before merging.
          add-paths: |
            translations/${{ inputs.language || 'en' }}/README.md
            translations/${{ inputs.language || 'en' }}/.index-translate-state.json
          delete-branch: true

      - name: Show pull request
        if: ${{ steps.pr.outputs.pull-request-url != '' }}
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: printf '\n[Review translation pull request](%s)\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
