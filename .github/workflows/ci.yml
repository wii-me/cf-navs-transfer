name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint（eslint.config.js）：worker/、src/、shared/、tests/、scripts/，不含格式化规则。
      - name: Lint
        run: npm run lint

      # 含 type-check:tests（tsconfig.tests.json），tests/ 与源码一同做类型检查。
      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # 首屏 JS / CSS 体积门禁（bundle-budget.json），超出即失败。
      - name: Bundle size budget
        run: npm run check:bundle

      # L1：起一个隔离的本地 Worker 实例跑 API 端到端冒烟。放在 Build 之后，因为
      # ASSETS 绑定要有 ./dist；脚本自己管临时 D1、空闲端口、一次性凭据与拆除。
      - name: API smoke test (L1)
        run: npm run smoke
        env:
          WRANGLER_SEND_METRICS: false
